<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma boîte à recettes</title>
<link rel="stylesheet" href="style.css">
<script src="assets/theme.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Ma boîte à recettes</h1>
      <p id="count">Chargement…</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </div>

  <div class="toolbar">
    <a class="check-toggle" href="courses.html">🛒 Liste de courses</a>
    <span class="sorter" id="sorter"></span>
  </div>

  <div class="search-wrap">
    <input class="search" id="search" placeholder="Chercher par titre ou ingrédient (ex. courgette)…">
    <button class="search-clear" id="search-clear" type="button" hidden aria-label="Vider la recherche">&times;</button>
  </div>

  <div class="filterbar">
    <div class="filter-menu" data-axis="status">
      <button class="chip menu-btn" type="button" data-menu-btn aria-haspopup="true" aria-expanded="false"></button>
      <div class="filter-pop" data-pop hidden><div data-options></div></div>
    </div>
    <div class="filter-menu" data-axis="category">
      <button class="chip menu-btn" type="button" data-menu-btn aria-haspopup="true" aria-expanded="false"></button>
      <div class="filter-pop" data-pop hidden><div data-options></div></div>
    </div>
    <div class="filter-menu" data-axis="ingredient">
      <button class="chip menu-btn" type="button" data-menu-btn aria-haspopup="true" aria-expanded="false"></button>
      <div class="filter-pop" data-pop hidden>
        <div class="search-wrap pop-search">
          <input class="search search-sm" id="ing-search" placeholder="Filtrer les ingrédients…">
          <button class="search-clear" id="ing-search-clear" type="button" hidden aria-label="Vider le filtre">&times;</button>
        </div>
        <div data-options></div>
      </div>
    </div>
    <button class="filter-reset" id="filter-reset" type="button" hidden>&times; effacer les filtres</button>
  </div>

  <div id="listwrap">
    <div class="empty"><div class="disp">Chargement…</div></div>
  </div>
</div>

<script type="module">
import { formatYield, formatDuration, STATUS_META, relativeTime, isRecent, foldAccents } from './assets/recipe-format.js';

let recipes = [];
let filters = { status: 'all', category: 'all', ingredient: 'all' };
let openMenu = null;   // axe du menu déroulé, ou null
let sort = 'recent';

const AXES = {
  status:     { label: 'Sélection',  all: 'Toutes' },
  category:   { label: 'Catégorie',  all: 'Toutes' },
  ingredient: { label: 'Ingrédient', all: 'Tous' },
};

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function load(){
  try{
    const res = await fetch('data/index.json');
    recipes = await res.json();
  }catch(e){
    recipes = [];
  }
  render();
}

// Une recette peut relever de plusieurs catégories : on aplatit pour la liste
// des filtres, et une même recette apparaît sous chacune d'elles.
function categories(){
  const set = new Set();
  recipes.forEach(r => (r.categories||[]).forEach(c => set.add(c)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr'));
}
function mainIngredients(){
  const set = new Set();
  recipes.forEach(r => (r.main_ingredients||[]).forEach(i => set.add(i)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr',{sensitivity:'base'}));
}

// Le seul endroit qui sait ce que veut dire « cette recette passe les filtres ».
// Il prend un jeu de filtres en paramètre pour servir aussi au comptage, où l'on
// neutralise un axe à la fois.
function matchRecipe(r, f, q){
  if(f.status !== 'all' && r.status !== f.status) return false;
  if(f.category !== 'all' && !(r.categories||[]).includes(f.category)) return false;
  if(f.ingredient !== 'all' && !(r.main_ingredients||[]).includes(f.ingredient)) return false;
  if(q && !foldAccents(r.title+' '+(r.description||'')+' '+(r.main_ingredients||[]).join(' ')).includes(q)) return false;
  return true;
}

// Ce que donnerait ce choix-ci, les autres filtres restant en place : c'est le
// nombre affiché en face de chaque option, et 0 signale une impasse.
function countFor(axis, value, q){
  const f = Object.assign({}, filters, { [axis]: value });
  return recipes.reduce((n, r) => n + (matchRecipe(r, f, q) ? 1 : 0), 0);
}

function axisOptions(axis, q){
  const values = axis === 'status' ? ['classic', 'favorite', 'untried']
    : axis === 'category' ? categories()
    : mainIngredients();
  const opts = values.map(value => ({
    value,
    label: axis === 'status' ? `${STATUS_META[value].icon} ${STATUS_META[value].label}` : value,
    count: countFor(axis, value, q),
  }));
  // Les ingrédients se comptent par dizaines : les plus fournis passent devant.
  // Les deux autres axes gardent leur ordre fixe, qui se lit d'un coup d'œil.
  if(axis === 'ingredient'){
    opts.sort((a,b) => b.count - a.count || a.value.localeCompare(b.value, 'fr', {sensitivity:'base'}));
  }
  return opts;
}

function renderSorter(){
  const wrap = document.getElementById('sorter');
  const choices = [['recent','Récentes'], ['title','A-Z']];
  wrap.innerHTML = choices.map(([value,label])=>
    `<button class="sort-btn ${sort===value?'active':''}" data-sort="${value}">${label}</button>`
  ).join('');
  wrap.querySelectorAll('[data-sort]').forEach(el=>{
    el.addEventListener('click', ()=>{ sort = el.dataset.sort; render(); });
  });
}

function renderFilters(q){
  document.querySelectorAll('.filter-menu').forEach(menu=>{
    const axis = menu.dataset.axis;
    const value = filters[axis];
    const btn = menu.querySelector('[data-menu-btn]');
    const pop = menu.querySelector('[data-pop]');
    const box = menu.querySelector('[data-options]');

    // Le bouton porte la valeur choisie : l'état du filtre se lit sans déplier.
    const active = value !== 'all';
    const label = !active ? AXES[axis].label
      : axis === 'status' ? `${STATUS_META[value].icon} ${STATUS_META[value].label}`
      : value;
    btn.className = `chip menu-btn${active ? ' active' : ''}${axis === 'status' && active ? ' st-'+value : ''}`;
    btn.innerHTML = `<span class="menu-btn-label">${escapeHtml(label)}</span><span class="caret">▾</span>`;
    btn.setAttribute('aria-expanded', String(openMenu === axis));
    pop.hidden = openMenu !== axis;

    let opts = axisOptions(axis, q);
    let note = '';
    if(axis === 'ingredient'){
      const field = menu.querySelector('#ing-search');
      const ingQ = foldAccents(field.value).trim();
      menu.querySelector('#ing-search-clear').hidden = field.value === '';
      if(!opts.length) note = 'Aucun ingrédient principal renseigné.';
      else if(ingQ){
        const kept = opts.filter(o => foldAccents(o.value).includes(ingQ));
        if(!kept.length) note = 'Aucun ingrédient ne correspond.';
        opts = kept;
      }
    }

    // « Toutes » d'abord, toujours : c'est la sortie du filtre.
    let html = `<button class="pop-opt${value === 'all' ? ' on' : ''}" type="button" data-value="all">`
      + `<span class="tick">${value === 'all' ? '✓' : ''}</span>${AXES[axis].all}</button>`;
    opts.forEach(o=>{
      const on = o.value === value;
      // Une option à zéro mène à une liste vide : elle reste lisible mais inerte.
      html += `<button class="pop-opt${on ? ' on' : ''}" type="button" data-value="${escapeHtml(o.value)}"`
        + `${o.count === 0 && !on ? ' disabled' : ''}>`
        + `<span class="tick">${on ? '✓' : ''}</span>${escapeHtml(o.label)}`
        + `<span class="pop-count">${o.count}</span></button>`;
    });
    if(note) html += `<div class="pop-note">${note}</div>`;
    box.innerHTML = html;
    box.querySelectorAll('[data-value]').forEach(el=>{
      el.addEventListener('click', ()=>{
        filters[axis] = el.dataset.value;
        closeMenu();
        render();
      });
    });
  });

  const any = Object.values(filters).some(v => v !== 'all');
  document.getElementById('filter-reset').hidden = !any;
}

function closeMenu(){
  if(!openMenu) return;
  const btn = document.querySelector(`.filter-menu[data-axis="${openMenu}"] [data-menu-btn]`);
  openMenu = null;
  document.querySelectorAll('[data-pop]').forEach(p=>{ p.hidden = true; });
  document.querySelectorAll('[data-menu-btn]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(btn) btn.focus();
}

function toggleMenu(axis){
  const wasOpen = openMenu === axis;
  openMenu = wasOpen ? null : axis;
  render();
  if(openMenu){
    const menu = document.querySelector(`.filter-menu[data-axis="${axis}"]`);
    placePop();
    const field = menu.querySelector('#ing-search');
    if(field && window.matchMedia('(pointer:fine)').matches) field.focus();
  }
}

// Un panneau ouvert près du bord droit sortirait de l'écran : on le rabat sur le
// bouton. À refaire quand la fenêtre change de taille — dont l'ouverture du
// clavier sur mobile, qui ne doit surtout pas refermer le menu.
function placePop(){
  if(!openMenu) return;
  const pop = document.querySelector(`.filter-menu[data-axis="${openMenu}"] [data-pop]`);
  pop.classList.remove('align-right');
  if(pop.getBoundingClientRect().right > window.innerWidth - 8) pop.classList.add('align-right');
}

function render(){
  const raw = document.getElementById('search').value;
  document.getElementById('search-clear').hidden = raw === '';
  const q = foldAccents(raw).trim();
  renderSorter();
  renderFilters(q);
  let list = recipes.filter(r => matchRecipe(r, filters, q));

  // "Récentes" trie sur updated : c'est la dernière activité, ajout ou retouche.
  list = sort === 'recent'
    ? list.slice().sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||'')))
    : list.slice().sort((a,b)=>a.title.toLowerCase().localeCompare(b.title.toLowerCase(),'fr'));

  const total = recipes.length;
  const kept = list.length;
  // Les filtres ne sont plus étalés sous les yeux : le compteur dit ce qu'ils coupent.
  document.getElementById('count').textContent = kept === total
    ? total + (total > 1 ? ' recettes gardées' : ' recette gardée')
    : `${kept} sur ${total} ${total > 1 ? 'recettes' : 'recette'}`;

  const wrap = document.getElementById('listwrap');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty"><div class="disp">${recipes.length===0?'Ta boîte est vide':'Aucun résultat'}</div><p>${recipes.length===0?'Ajoute une première recette dans data/recipes/.':'Essaie un autre filtre ou une autre recherche.'}</p></div>`;
    return;
  }
  wrap.innerHTML = '<div class="grid">' + list.map(r=>`
    <a class="rcard ${escapeHtml(r.status||'none')}" href="recipe.html?id=${encodeURIComponent(r.id)}">
      <div class="rcard-top">
        <h3>${escapeHtml(r.title)}</h3>
        <span class="mark ${escapeHtml(r.status||'none')}">${(STATUS_META[r.status]||STATUS_META.none).icon}</span>
      </div>
      ${r.description?`<div class="desc">${escapeHtml(r.description)}</div>`:''}
      <div class="tags">
        ${isRecent(r.created)?'<span class="tag new">nouveau</span>':''}
        ${(r.categories||[]).map(c=>`<span class="tag">${escapeHtml(c)}</span>`).join('')}
        ${r.servings?`<span class="tag rust">${escapeHtml(formatYield(r.servings, r.yield_label))}</span>`:''}
        ${r.total_time?`<span class="tag time">⏱ ${escapeHtml(formatDuration(r.total_time))}</span>`:''}
        ${r.needs_review?'<span class="tag review">à vérifier</span>':''}
      </div>
      ${sort==='recent'?`<div class="card-when">${escapeHtml(relativeTime(r.updated))}</div>`:''}
    </a>
  `).join('') + '</div>';
}

// Les deux champs se comportent pareil : saisie, croix, et Échap pour vider.
[['search','search-clear'], ['ing-search','ing-search-clear']].forEach(([inputId, clearId])=>{
  const input = document.getElementById(inputId);
  const clear = ()=>{ input.value = ''; input.focus(); render(); };
  input.addEventListener('input', render);
  input.addEventListener('keydown', e=>{ if(e.key === 'Escape' && input.value){ e.preventDefault(); e.stopPropagation(); clear(); } });
  document.getElementById(clearId).addEventListener('click', clear);
});

document.querySelectorAll('[data-menu-btn]').forEach(btn=>{
  btn.addEventListener('click', e=>{
    // Le clic sur un bouton de menu n'est jamais un « clic ailleurs ». Il faut
    // l'arrêter ici : toggleMenu() réécrit le contenu du bouton, et le nœud
    // cliqué — le libellé — se retrouve détaché avant d'atteindre le document,
    // où closest() ne le rattacherait plus à son menu.
    e.stopPropagation();
    toggleMenu(btn.closest('.filter-menu').dataset.axis);
  });
});
document.getElementById('filter-reset').addEventListener('click', ()=>{
  filters = { status: 'all', category: 'all', ingredient: 'all' };
  document.getElementById('ing-search').value = '';
  closeMenu();
  render();
});
// Un menu ouvert se referme au clic ailleurs ou sur Échap, comme tout menu.
document.addEventListener('click', e=>{
  if(openMenu && !e.target.closest(`.filter-menu[data-axis="${openMenu}"]`)) closeMenu();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && openMenu) closeMenu();
});
window.addEventListener('resize', placePop);

load();
</script>
</body>
</html>
