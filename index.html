<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma boîte à recettes</title>
<link rel="stylesheet" href="style.css">
<script src="assets/theme.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Ma boîte à recettes</h1>
      <p id="count">Chargement…</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </div>

  <div class="toolbar">
    <a class="check-toggle" href="courses.html">🛒 Liste de courses</a>
    <span class="sorter" id="sorter"></span>
  </div>

  <div class="search-wrap">
    <input class="search" id="search" placeholder="Chercher par titre ou ingrédient (ex. courgette)…">
    <button class="search-clear" id="search-clear" type="button" hidden aria-label="Vider la recherche">&times;</button>
  </div>

  <div class="section-label" style="margin-top:0;">Ma sélection</div>
  <div class="filters" id="status-filters"></div>

  <div class="section-label">Catégorie</div>
  <div class="filters" id="cat-filters"></div>

  <div class="section-label">Ingrédient principal</div>
  <div class="search-wrap search-wrap-sm" id="ing-search-wrap" hidden>
    <input class="search search-sm" id="ing-search" placeholder="Filtrer les ingrédients…">
    <button class="search-clear" id="ing-search-clear" type="button" hidden aria-label="Vider le filtre">&times;</button>
  </div>
  <div class="filters wrapped" id="ing-filters"></div>

  <div id="listwrap">
    <div class="empty"><div class="disp">Chargement…</div></div>
  </div>
</div>

<script type="module">
import { formatYield, formatDuration, STATUS_META, relativeTime, isRecent, foldAccents } from './assets/recipe-format.js';

let recipes = [];
let category = 'all';
let ingredient = 'all';
let ingExpanded = false;
let status = 'all';
let sort = 'recent';

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function load(){
  try{
    const res = await fetch('data/index.json');
    recipes = await res.json();
  }catch(e){
    recipes = [];
  }
  render();
}

// Une recette peut relever de plusieurs catégories : on aplatit pour la liste
// des filtres, et une même recette apparaît sous chacune d'elles.
function categories(){
  const set = new Set();
  recipes.forEach(r => (r.categories||[]).forEach(c => set.add(c)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr'));
}
// Les ingrédients qui reviennent le plus sont ceux qu'on cherche le plus : ils
// passent devant, et l'alphabétique ne départage que les ex aequo.
function mainIngredients(){
  const counts = new Map();
  recipes.forEach(r => (r.main_ingredients||[]).forEach(i => counts.set(i, (counts.get(i)||0) + 1)));
  return Array.from(counts, ([name, count]) => ({ name, count }))
    .sort((a,b) => b.count - a.count || a.name.localeCompare(b.name, 'fr', {sensitivity:'base'}));
}

// Nombre de chips visibles tant que la liste n'est pas dépliée.
const ING_COLLAPSED = 12;

function renderSorter(){
  const wrap = document.getElementById('sorter');
  const choices = [['recent','Récentes'], ['title','A-Z']];
  wrap.innerHTML = choices.map(([value,label])=>
    `<button class="sort-btn ${sort===value?'active':''}" data-sort="${value}">${label}</button>`
  ).join('');
  wrap.querySelectorAll('[data-sort]').forEach(el=>{
    el.addEventListener('click', ()=>{ sort = el.dataset.sort; render(); });
  });
}

function renderFilters(){
  // status est une valeur unique : les chips s'excluent, comme les catégories.
  const statusWrap = document.getElementById('status-filters');
  // Ordre décroissant d'estime : le répertoire d'abord, les inconnues en dernier.
  const choices = [['all','Toutes'], ['classic','◆ classique'], ['favorite','★ à refaire'], ['untried','○ jamais essayé']];
  statusWrap.innerHTML = choices.map(([value,label])=>
    `<div class="chip st-${value} ${status===value?'active':''}" data-status="${value}">${label}</div>`
  ).join('');
  statusWrap.querySelectorAll('[data-status]').forEach(el=>{
    el.addEventListener('click', ()=>{ status = el.dataset.status; render(); });
  });

  const catWrap = document.getElementById('cat-filters');
  let html = `<div class="chip ${category==='all'?'active':''}" data-cat="all">Toutes</div>`;
  categories().forEach(c=>{
    html += `<div class="chip ${category===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`;
  });
  catWrap.innerHTML = html;
  catWrap.querySelectorAll('[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ category = el.dataset.cat; render(); });
  });

  const ingWrap = document.getElementById('ing-filters');
  const ings = mainIngredients();
  const ingSearchWrap = document.getElementById('ing-search-wrap');
  const ingSearch = document.getElementById('ing-search');
  // Le champ ne sert à rien tant que tout tient sans repli.
  ingSearchWrap.hidden = ings.length <= ING_COLLAPSED;
  if(ingSearchWrap.hidden) ingSearch.value = '';
  const ingQ = foldAccents(ingSearch.value).trim();
  document.getElementById('ing-search-clear').hidden = ingSearch.value === '';

  if(!ings.length){
    ingWrap.innerHTML = `<span class="filters-note">Ajoute main_ingredients dans tes fichiers recette pour filtrer ici.</span>`;
    return;
  }

  const matching = ingQ ? ings.filter(i => foldAccents(i.name).includes(ingQ)) : ings;
  // Une recherche en cours montre tout ce qui correspond : le repli ne s'applique
  // qu'à la liste complète.
  const collapsed = !ingQ && !ingExpanded && matching.length > ING_COLLAPSED;
  let shown = collapsed ? matching.slice(0, ING_COLLAPSED) : matching;
  // Le chip actif reste visible quoi qu'il arrive — replié hors des premiers, ou
  // écarté par le filtre : sinon on ne verrait plus sur quoi la liste est filtrée.
  if(ingredient !== 'all' && !shown.some(i => i.name === ingredient)){
    const active = ings.find(i => i.name === ingredient);
    if(active) shown = shown.concat(active);
  }

  let ihtml = `<div class="chip ${ingredient==='all'?'active':''}" data-ing="all">Tous</div>`;
  shown.forEach(i=>{
    const count = i.count > 1 ? `<span class="chip-count">${i.count}</span>` : '';
    ihtml += `<div class="chip ${ingredient===i.name?'active':''}" data-ing="${escapeHtml(i.name)}">${escapeHtml(i.name)}${count}</div>`;
  });
  if(collapsed){
    ihtml += `<button class="chip more-btn" type="button" data-ing-more="1">▾ + ${matching.length - ING_COLLAPSED} autres</button>`;
  }else if(!ingQ && ingExpanded && matching.length > ING_COLLAPSED){
    ihtml += `<button class="chip more-btn" type="button" data-ing-more="1">▴ réduire</button>`;
  }
  if(ingQ && !matching.length){
    ihtml += `<span class="filters-note">Aucun ingrédient ne correspond.</span>`;
  }
  ingWrap.innerHTML = ihtml;
  ingWrap.querySelectorAll('[data-ing]').forEach(el=>{
    el.addEventListener('click', ()=>{ ingredient = el.dataset.ing; render(); });
  });
  const moreBtn = ingWrap.querySelector('[data-ing-more]');
  if(moreBtn) moreBtn.addEventListener('click', ()=>{ ingExpanded = !ingExpanded; render(); });
}

function render(){
  renderSorter();
  renderFilters();
  const raw = document.getElementById('search').value;
  document.getElementById('search-clear').hidden = raw === '';
  const q = foldAccents(raw).trim();
  let list = recipes.filter(r=>{
    if(status!=='all' && r.status!==status) return false;
    if(category!=='all' && !(r.categories||[]).includes(category)) return false;
    if(ingredient!=='all' && !(r.main_ingredients||[]).includes(ingredient)) return false;
    if(q){
      const hay = foldAccents(r.title+' '+(r.description||'')+' '+(r.main_ingredients||[]).join(' '));
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  // "Récentes" trie sur updated : c'est la dernière activité, ajout ou retouche.
  list = sort === 'recent'
    ? list.slice().sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||'')))
    : list.slice().sort((a,b)=>a.title.toLowerCase().localeCompare(b.title.toLowerCase(),'fr'));

  document.getElementById('count').textContent = recipes.length + (recipes.length>1?' recettes gardées':' recette gardée');

  const wrap = document.getElementById('listwrap');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty"><div class="disp">${recipes.length===0?'Ta boîte est vide':'Aucun résultat'}</div><p>${recipes.length===0?'Ajoute une première recette dans data/recipes/.':'Essaie un autre filtre ou une autre recherche.'}</p></div>`;
    return;
  }
  wrap.innerHTML = '<div class="grid">' + list.map(r=>`
    <a class="rcard ${escapeHtml(r.status||'none')}" href="recipe.html?id=${encodeURIComponent(r.id)}">
      <div class="rcard-top">
        <h3>${escapeHtml(r.title)}</h3>
        <span class="mark ${escapeHtml(r.status||'none')}">${(STATUS_META[r.status]||STATUS_META.none).icon}</span>
      </div>
      ${r.description?`<div class="desc">${escapeHtml(r.description)}</div>`:''}
      <div class="tags">
        ${isRecent(r.created)?'<span class="tag new">nouveau</span>':''}
        ${(r.categories||[]).map(c=>`<span class="tag">${escapeHtml(c)}</span>`).join('')}
        ${r.servings?`<span class="tag rust">${escapeHtml(formatYield(r.servings, r.yield_label))}</span>`:''}
        ${r.total_time?`<span class="tag time">⏱ ${escapeHtml(formatDuration(r.total_time))}</span>`:''}
        ${r.needs_review?'<span class="tag review">à vérifier</span>':''}
      </div>
      ${sort==='recent'?`<div class="card-when">${escapeHtml(relativeTime(r.updated))}</div>`:''}
    </a>
  `).join('') + '</div>';
}

// Les deux champs se comportent pareil : saisie, croix, et Échap pour vider.
[['search','search-clear'], ['ing-search','ing-search-clear']].forEach(([inputId, clearId])=>{
  const input = document.getElementById(inputId);
  const clear = ()=>{ input.value = ''; input.focus(); render(); };
  input.addEventListener('input', render);
  input.addEventListener('keydown', e=>{ if(e.key === 'Escape' && input.value){ e.preventDefault(); clear(); } });
  document.getElementById(clearId).addEventListener('click', clear);
});
load();
</script>
</body>
</html>
