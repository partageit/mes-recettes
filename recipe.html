<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recette</title>
<link rel="stylesheet" href="style.css">
<script src="assets/theme.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="backlink" href="index.html">← toutes les recettes</a>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </div>
  <div id="content" class="detail" style="margin-top:14px;">
    <div class="empty"><div class="disp">Chargement…</div></div>
  </div>
</div>

<script type="module">
import { parseRecipeMarkdown, formatYield, formatDuration, STATUS_META, ingredientLabel, isOptionalIngredient, parseStamp } from './assets/recipe-format.js';

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

let recipe = null;
let servings = null;

// État des minuteurs, indexé par numéro d'étape. Conservé hors du DOM pour
// survivre aux re-rendus déclenchés par le changement de portions.
const timers = {};

// Mode vérification : on coche ce qu'on a sous la main pour voir ce qui manque.
// L'état survit à un aller-retour sur le site, mais reste local au navigateur.
let checkMode = false;
let checked = new Set();

// Étapes faites : cochées d'un clic sur leur pastille. Contrairement aux
// ingrédients, l'état est éphémère — on refait la recette des semaines plus tard
// et on ne veut pas la retrouver déjà cochée. Passé ce délai sans y toucher, on
// repart de zéro.
const STEPS_TTL = 6 * 3600 * 1000;
let doneSteps = new Set();

function storageKey(){
  return 'mes-recettes:check:' + (recipe ? recipe.id : '');
}

function stepsKey(){
  return 'mes-recettes:steps:' + (recipe ? recipe.id : '');
}

function loadChecked(){
  try{
    const raw = localStorage.getItem(storageKey());
    checked = new Set(raw ? JSON.parse(raw) : []);
  }catch(e){ checked = new Set(); }
}

function saveChecked(){
  try{
    localStorage.setItem(storageKey(), JSON.stringify([...checked]));
  }catch(e){ /* navigation privée, quota : le mode reste utilisable sans mémoire */ }
}

function loadDoneSteps(){
  doneSteps = new Set();
  try{
    const raw = localStorage.getItem(stepsKey());
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(Date.now() - (saved.at || 0) > STEPS_TTL){ localStorage.removeItem(stepsKey()); return; }
    doneSteps = new Set(saved.steps || []);
  }catch(e){ doneSteps = new Set(); }
}

// L'horodatage suit la dernière étape cochée : une recette avec deux heures de
// repos au milieu ne doit pas se vider pendant qu'on attend.
function saveDoneSteps(){
  try{
    if(!doneSteps.size) localStorage.removeItem(stepsKey());
    else localStorage.setItem(stepsKey(), JSON.stringify({at: Date.now(), steps: [...doneSteps]}));
  }catch(e){ /* navigation privée, quota : le suivi reste utilisable sans mémoire */ }
}

window.toggleCheckMode = function(){
  checkMode = !checkMode;
  render();
};

window.resetChecked = function(){
  checked.clear();
  saveChecked();
  render();
};

window.resetSteps = function(){
  doneSteps.clear();
  saveDoneSteps();
  paintSteps();
};

async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(!id){ showError(); return; }
  try{
    const res = await fetch('data/recipes/' + id + '.md');
    if(!res.ok) throw new Error('not found');
    const text = await res.text();
    recipe = parseRecipeMarkdown(text);
    servings = parseFloat(recipe.servings) || 4;
    loadChecked();
    loadDoneSteps();
    render();
  }catch(e){
    showError();
  }
}

function showError(){
  document.getElementById('content').innerHTML = `<div class="empty"><div class="disp">Recette introuvable</div><p>Elle a peut-être été renommée ou supprimée.</p></div>`;
}

window.changeServings = function(delta){
  servings = Math.max(1, servings + delta);
  render();
};

// created et updated portent l'heure (YYYY-MM-DDTHH:MM) : c'est parseStamp qui
// sait les lire. Y ajouter 'T00:00:00' fabriquait une date invalide, et la ligne
// affichait l'horodatage brut.
function formatDate(stamp){
  const d = parseStamp(stamp);
  if(!d) return '';
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}

// « Modifiée le » n'a d'intérêt que si la recette a bougé depuis sa création.
function dateLine(r){
  const parts = [];
  const created = formatDate(r.created);
  const updated = formatDate(r.updated);
  if(created) parts.push('Ajoutée le ' + created);
  if(updated && r.updated !== r.created) parts.push('modifiée le ' + updated);
  if(!parts.length) return '';
  return `<div class="dates">${escapeHtml(parts.join(', '))}</div>`;
}

// Barre du mode vérification : bouton d'entrée, puis décompte de ce qui manque.
function checkBar(r){
  const total = r.ingredients.length;
  if(!checkMode){
    return `<div class="checkbar"><button class="check-toggle" onclick="toggleCheckMode()">Vérifier les ingrédients</button></div>`;
  }
  const missing = r.ingredients.filter((ing,i)=>!checked.has(String(i)) && !isOptionalIngredient(ing.name)).length;
  const label = missing === 0
    ? 'Tu as tout ✓'
    : `${missing} à vérifier sur ${total}`;
  return `<div class="checkbar">`
    + `<span class="check-count ${missing===0?'ok':''}">${label}</span>`
    + `<button class="check-toggle" onclick="resetChecked()">Tout décocher</button>`
    + `<button class="check-toggle" onclick="toggleCheckMode()">Quitter</button>`
    + `</div>`;
}

// Barre des étapes : n'apparaît qu'une fois la première étape cochée, pour ne
// pas encombrer une recette qu'on ne fait que lire.
function stepBar(r){
  const total = (r.steps || []).length;
  const done = (r.steps || []).filter((s, i) => doneSteps.has(String(i))).length;
  if(!done) return `<div class="stepbar"></div>`;
  const label = done === total ? 'Recette terminée ✓' : `${done} / ${total} étapes`;
  return `<div class="stepbar">`
    + `<span class="step-count ${done === total ? 'ok' : ''}">${label}</span>`
    + `<button class="check-toggle" onclick="resetSteps()">Recommencer</button>`
    + `</div>`;
}

// L'étape courante est la première qui reste à faire : quand on relève les yeux
// de la casserole, on retrouve où on en était.
function currentStep(){
  const total = (recipe.steps || []).length;
  for(let i = 0; i < total; i++){
    if(!doneSteps.has(String(i))) return i;
  }
  return -1;
}

// Repeint l'état des étapes sans re-rendre la page : un render() complet
// couperait les minuteurs en cours.
function paintSteps(){
  const current = currentStep();
  document.querySelectorAll('.steps li').forEach((li, i) => {
    const done = doneSteps.has(String(i));
    li.classList.toggle('done', done);
    li.classList.toggle('current', i === current);
    const mark = li.querySelector('.step-mark');
    if(!mark) return;
    mark.textContent = done ? '✓' : String(i + 1);
    mark.setAttribute('aria-pressed', done ? 'true' : 'false');
    mark.title = done ? 'Étape faite — cliquer pour la refaire' : 'Marquer cette étape comme faite';
  });
  const bar = document.querySelector('.stepbar');
  if(bar) bar.outerHTML = stepBar(recipe);
}

function markStep(index, done){
  const key = String(index);
  if(done) doneSteps.add(key); else doneSteps.delete(key);
  saveDoneSteps();
  paintSteps();
}

function timesBar(r){
  const parts = [
    ['Préparation', r.prep_time],
    ['Cuisson', r.cook_time],
    ['Repos', r.rest_time],
  ].filter(([, v]) => v);

  const cells = parts.map(([label, v]) =>
    `<div class="time-cell"><span class="time-label">${label}</span><span class="time-value">${escapeHtml(formatDuration(v))}</span></div>`
  );
  // Un seul temps se suffit à lui-même : pas de total qui le répète.
  if(parts.length > 1){
    const total = parts.reduce((sum, [, v]) => sum + v, 0);
    cells.push(`<div class="time-cell total"><span class="time-label">Total</span><span class="time-value">${escapeHtml(formatDuration(total))}</span></div>`);
  }
  if(r.mold){
    cells.push(`<div class="time-cell"><span class="time-label">Moule</span><span class="time-value">${escapeHtml(r.mold)}</span></div>`);
  }
  if(!cells.length) return '';
  return `<div class="timesbar">${cells.join('')}</div>`;
}

// --- Minuteurs ---

function clock(seconds){
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

// Un minuteur est identifié par une clé : le numéro de l'étape, ou
// « c<section>-<tableau>-<ligne>-<colonne> » pour une case de tableau d'un mémo.
function isStepTimer(key){
  return /^\d+$/.test(String(key));
}

function timerMinutes(key){
  const cell = /^c(\d+)-(\d+)-(\d+)-(\d+)$/.exec(key);
  if(cell) return recipe.sections[cell[1]].blocks[cell[2]].rows[cell[3]][cell[4]].minutes;
  return recipe.steps[key].minutes;
}

// data-minutes n'est lu qu'à l'impression : la durée de l'étape ne vit nulle
// part ailleurs dans le DOM, splitStepDuration l'ayant retirée du texte.
function timerButton(key, minutes){
  return `<button class="timer" data-timer="${key}" data-minutes="${escapeHtml(formatDuration(minutes))}" type="button"></button>`
    + `<button class="timer-reset" data-reset="${key}" type="button" title="Réinitialiser">↺</button>`;
}

function paintTimer(key){
  const btn = document.querySelector(`.timer[data-timer="${key}"]`);
  if(!btn) return;
  const t = timers[key];
  const reset = document.querySelector(`.timer-reset[data-reset="${key}"]`);

  if(!t){
    btn.textContent = `▶ ${formatDuration(timerMinutes(key))}`;
    btn.className = 'timer';
    if(reset) reset.hidden = true;
    return;
  }
  if(reset) reset.hidden = false;
  if(t.remaining <= 0){
    btn.textContent = '✓ terminé';
    btn.className = 'timer done';
    return;
  }
  btn.textContent = `${t.running ? '⏸' : '▶'} ${clock(t.remaining)}`;
  btn.className = 'timer ' + (t.running ? 'running' : 'paused');
}

function paintAllTimers(){
  document.querySelectorAll('.timer').forEach(btn => paintTimer(btn.dataset.timer));
}

let audio = null;
function beep(){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const now = audio.currentTime;
    [0, 0.45].forEach(offset => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.2, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.35);
      osc.connect(gain).connect(audio.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.4);
    });
  }catch(e){ /* pas de son disponible : l'affichage suffit */ }
}

setInterval(() => {
  Object.keys(timers).forEach(index => {
    const t = timers[index];
    if(!t.running || t.remaining <= 0) return;
    t.remaining -= 1;
    if(t.remaining <= 0){
      t.running = false;
      beep();
      if(isStepTimer(index)) markStep(index, true);
    }
    paintTimer(index);
  });
}, 1000);

document.getElementById('content').addEventListener('change', event => {
  const box = event.target.closest('input[data-ing]');
  if(!box) return;
  const key = box.dataset.ing;
  if(box.checked) checked.add(key); else checked.delete(key);
  saveChecked();
  box.closest('.ing-row').classList.toggle('has', box.checked);
  // Seul le décompte bouge : un re-rendu complet couperait les minuteurs en cours.
  const bar = document.querySelector('.checkbar');
  if(bar) bar.outerHTML = checkBar(recipe);
});

document.getElementById('content').addEventListener('click', event => {
  const mark = event.target.closest('.step-mark');
  if(mark){
    const index = mark.dataset.step;
    markStep(index, !doneSteps.has(String(index)));
    return;
  }
  const start = event.target.closest('.timer');
  if(start){
    const index = start.dataset.timer;
    if(!timers[index] || timers[index].remaining <= 0){
      timers[index] = { remaining: timerMinutes(index) * 60, running: true };
      if(isStepTimer(index)) markStep(index, false);
    } else {
      timers[index].running = !timers[index].running;
    }
    paintTimer(index);
    return;
  }
  const reset = event.target.closest('.timer-reset');
  if(reset){
    const index = reset.dataset.reset;
    delete timers[index];
    if(isStepTimer(index)) markStep(index, false);
    paintTimer(index);
  }
});

// Sections libres : paragraphes et tableaux, dans l'ordre du fichier. Un tableau
// large défile dans son cadre plutôt que d'élargir la page sur téléphone.
function sectionsHtml(r){
  return (r.sections || []).map((section, s) => `
    <div class="section-label">${escapeHtml(section.title)}</div>
    ${section.blocks.map((block, b) => block.kind === 'text'
      ? `<p class="memo-text">${escapeHtml(block.text)}</p>`
      : `<div class="table-wrap"><table class="memo-table">
          <thead><tr>${block.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
          <tbody>${block.rows.map((row, i)=>`<tr>${row.map((cell, c)=>
            `<td>${escapeHtml(cell.text)}${cell.minutes?`<span class="step-timer">${timerButton(`c${s}-${b}-${i}-${c}`, cell.minutes)}</span>`:''}</td>`
          ).join('')}</tr>`).join('')}</tbody>
        </table></div>`
    ).join('')}
  `).join('');
}

// Un mémo n'a ni portions ni ingrédients : ni barre de portions, ni
// vérification du placard, ni étapes à cocher.
function recipeBody(r){
  const base = parseFloat(r.servings) || 4;
  const factor = servings / base;
  return `
    <div class="servingsbar">
      <button onclick="changeServings(-1)">−</button>
      <span>${escapeHtml(formatYield(Math.round(servings), r.yield_label))}</span>
      <button onclick="changeServings(1)">+</button>
    </div>
    <div class="section-label">Ingrédients</div>
    ${checkBar(r)}
    ${r.ingredients.map((ing,i)=>{
      const amt = ing.amount ? (Math.round(ing.amount*factor*100)/100) : '';
      const qty = `${amt}${ing.unit?(' '+escapeHtml(ing.unit)):''}`;
      const optional = isOptionalIngredient(ing.name);
      if(!checkMode){
        return `<div class="ing-row"><span>${escapeHtml(ing.name)}</span><span>${qty}</span></div>`;
      }
      const has = checked.has(String(i));
      return `<label class="ing-row check ${has?'has':''}">`
        + `<input type="checkbox" data-ing="${i}" ${has?'checked':''}>`
        + `<span class="ing-name">${escapeHtml(ingredientLabel(ing.name))}`
        + `${optional?'<span class="opt">optionnel</span>':''}</span>`
        + `<span>${qty}</span></label>`;
    }).join('')}
    <div class="section-label steps-head"><span>Étapes</span>${stepBar(r)}</div>
    <ol class="steps">${r.steps.map((s,i)=>
      `<li><button class="step-mark" type="button" data-step="${i}" aria-pressed="false"></button>`
      + `${escapeHtml(s.text)}${s.minutes?`<span class="step-timer">${timerButton(i, s.minutes)}</span>`:''}</li>`
    ).join('')}</ol>
  `;
}

function render(){
  const r = recipe;
  const st = STATUS_META[r.status] || STATUS_META.none;
  document.getElementById('content').innerHTML = `
    <h2>${escapeHtml(r.title)} <span class="mark ${escapeHtml(r.status)}">${st.icon}</span></h2>
    ${r.description?`<div class="desc">${escapeHtml(r.description)}</div>`:''}
    <div class="tags">
      ${r.type==='memo'?'<span class="tag memo">mémo</span>':''}
      ${r.categories.map(c=>`<span class="tag">${escapeHtml(c)}</span>`).join('')}
      ${st.label?`<span class="tag tag-${escapeHtml(r.status)}">${st.label}</span>`:''}
    </div>
    ${timesBar(r)}
    ${r.type==='memo'?'':recipeBody(r)}
    ${sectionsHtml(r)}
    ${r.notes?`<div class="section-label">Notes</div><div class="notes">${escapeHtml(r.notes)}</div>`:''}
    ${r.source_url?`<a class="sourcelink" href="${escapeHtml(r.source_url)}" target="_blank" rel="noopener">Source originale ↗</a>`:''}
    ${dateLine(r)}
  `;
  paintSteps();
  paintAllTimers();
}

load();
</script>
</body>
</html>
