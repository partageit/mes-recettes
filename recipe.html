    <div class="top-actions">

        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V1.5M4.75 4.5 8 1.5l3.25 3M5.5 7H3.5v7.5h9V7h-2"/></svg>

        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M1 1h6v6H1zm1.5 1.5v3h3v-3zM9 1h6v6H9zm1.5 1.5v3h3v-3zM1 9h6v6H1zm1.5 1.5v3h3v-3zM9 9h2v2H9zm2 2h2v2h-2zm2-2h2v2h-2zm0 4h2v2h-2zm-4 0h2v2H9z"/></svg>

<!-- Hors de #content : render() remplace tout son contenu, le panneau ouvert
     disparaîtrait avec. -->
<button id="ing-fab" class="ing-fab" type="button" hidden>Ingrédients</button>
<div id="timer-bar" class="timer-bar" hidden></div>

  <div class="sheet-inner">
    <div class="sheet-head">

      <button class="sheet-close" type="button" aria-label="Fermer">✕</button>

    <div class="sheet-head">
      <span class="section-label" id="qr-sheet-title">Scanner pour ouvrir la recette</span>
      <button class="sheet-close" type="button" aria-label="Fermer">✕</button>
    </div>

<script type="module">
import { parseRecipeMarkdown, formatYield, formatDuration, STATUS_META, ingredientLabel, isOptionalIngredient, parseStamp } from './assets/recipe-format.js';
import { stepIngredients } from './assets/step-ingredients.js';
import qrcode from './assets/qrcode.js';

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

let recipe = null;
let servings = null;

// État des minuteurs, indexé par numéro d'étape (ou case de mémo). Conservé
// hors du DOM pour survivre aux re-rendus déclenchés par le changement de
// portions, et dans le localStorage pour survivre à un rechargement.
const timers = {};

// Mode vérification : on coche ce qu'on a sous la main pour voir ce qui manque.
// L'état survit à un aller-retour sur le site, mais reste local au navigateur.
let checkMode = false;
let checked = new Set();

// Étapes faites : cochées d'un clic sur leur pastille. Contrairement aux
// ingrédients, l'état est éphémère — on refait la recette des semaines plus tard
// et on ne veut pas la retrouver déjà cochée. Passé ce délai sans y toucher, on
// repart de zéro.
const STEPS_TTL = 6 * 3600 * 1000;
let doneSteps = new Set();

// Ingrédients cités par chaque étape (index dans recipe.ingredients), et
// l'inverse : les étapes qui citent chaque ingrédient. Calculés une fois au
// chargement, la recette ne change plus ensuite.
let stepIngs = [];
let stepsOfIng = [];

function storageKey(){
  return 'mes-recettes:check:' + (recipe ? recipe.id : '');
}

function stepsKey(){
  return 'mes-recettes:steps:' + (recipe ? recipe.id : '');
}

function servingsKey(){
  return 'mes-recettes:servings:' + (recipe ? recipe.id : '');
}

function loadChecked(){
  try{
    const raw = localStorage.getItem(storageKey());
    checked = new Set(raw ? JSON.parse(raw) : []);
  }catch(e){ checked = new Set(); }
}

function saveChecked(){
  try{
    localStorage.setItem(storageKey(), JSON.stringify([...checked]));
  }catch(e){ /* navigation privée, quota : le mode reste utilisable sans mémoire */ }
}

function loadDoneSteps(){
  doneSteps = new Set();
  try{
    const raw = localStorage.getItem(stepsKey());
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(Date.now() - (saved.at || 0) > STEPS_TTL){ localStorage.removeItem(stepsKey()); return; }
    doneSteps = new Set(saved.steps || []);
  }catch(e){ doneSteps = new Set(); }
}

// Portions choisies : éphémères comme les étapes, et pour la même raison. On
// retrouve son choix en revenant sur la fiche pendant la préparation, pas la
// fois suivante. Seul un nombre différent de celui de la fiche est retenu.
function loadServings(){
  servings = parseFloat(recipe.servings) || 4;
  try{
    const raw = localStorage.getItem(servingsKey());
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(Date.now() - (saved.at || 0) > STEPS_TTL){ localStorage.removeItem(servingsKey()); return; }
    if(saved.servings >= 1) servings = saved.servings;
  }catch(e){ /* valeur illisible : on garde celle de la fiche */ }
}

function saveServings(){
  try{
    if(servings === (parseFloat(recipe.servings) || 4)) localStorage.removeItem(servingsKey());
    else localStorage.setItem(servingsKey(), JSON.stringify({at: Date.now(), servings}));
  }catch(e){ /* navigation privée, quota : le choix vaut pour cette visite seulement */ }
}

// L'horodatage suit la dernière étape cochée : une recette avec deux heures de
// repos au milieu ne doit pas se vider pendant qu'on attend.
function saveDoneSteps(){
  try{
    if(!doneSteps.size) localStorage.removeItem(stepsKey());
    else localStorage.setItem(stepsKey(), JSON.stringify({at: Date.now(), steps: [...doneSteps]}));
  }catch(e){ /* navigation privée, quota : le suivi reste utilisable sans mémoire */ }
}

window.toggleCheckMode = function(){
  checkMode = !checkMode;
  render();
};

window.resetChecked = function(){
  checked.clear();
  saveChecked();
  render();
};

window.resetSteps = function(){
  doneSteps.clear();
  saveDoneSteps();
  paintSteps();
};

async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(!id){ showError(); return; }
  try{
    const res = await fetch('data/recipes/' + id + '.md');
    if(!res.ok) throw new Error('not found');
    const text = await res.text();
    recipe = parseRecipeMarkdown(text);
    // Onglet, historique, favoris et icône d'écran d'accueil.
    document.title = recipe.title;
    loadServings();
    stepIngs = stepIngredients(recipe);
    stepsOfIng = recipe.ingredients.map((ing, k) =>
      stepIngs.flatMap((list, i) => list.includes(k) ? [i] : []));
    await loadSeeAlso();
    loadChecked();
    loadDoneSteps();
    loadTimers();
    tick(false);
    qrToggle.hidden = false;
    shareToggle.hidden = false;
    render();
  }catch(e){
    showError();
  }
}

// Les renvois sont des slugs : leur titre vient de l'index, pour rester juste
// quand la fiche liée est renommée. Un slug absent de l'index n'est pas affiché.
let seeAlso = [];
async function loadSeeAlso(){
  seeAlso = [];
  if(!recipe.see_also.length) return;
  try{
    const index = await (await fetch('data/index.json')).json();
    seeAlso = recipe.see_also
      .map(id => index.find(r => r.id === id))
      .filter(Boolean);
  }catch(e){ /* sans index, la fiche s'affiche sans ses renvois */ }
}

function seeAlsoHtml(){
  if(!seeAlso.length) return '';
  return `<div class="section-label">Voir aussi</div><div class="seealso">`
    + seeAlso.map(r => `<a href="recipe.html?id=${encodeURIComponent(r.id)}">${escapeHtml(r.title)}`
      + `${r.type === 'memo' ? ' <span class="tag memo">mémo</span>' : ''}</a>`).join('')
    + `</div>`;
}

function showError(){
  document.getElementById('content').innerHTML = `<div class="empty"><div class="disp">Recette introuvable</div><p>Elle a peut-être été renommée ou supprimée.</p></div>`;
}

window.changeServings = function(delta){
  servings = Math.max(1, servings + delta);
  saveServings();
  render();
};

// created et updated portent l'heure (YYYY-MM-DDTHH:MM) : c'est parseStamp qui
// sait les lire. Y ajouter 'T00:00:00' fabriquait une date invalide, et la ligne
// affichait l'horodatage brut.
function formatDate(stamp){
  const d = parseStamp(stamp);
  if(!d) return '';
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}

// « Modifiée le » n'a d'intérêt que si la recette a bougé depuis sa création.
function dateLine(r){
  const parts = [];
  const created = formatDate(r.created);
  const updated = formatDate(r.updated);
  if(created) parts.push('Ajoutée le ' + created);
  if(updated && r.updated !== r.created) parts.push('modifiée le ' + updated);
  if(!parts.length) return '';
  return `<div class="dates">${escapeHtml(parts.join(', '))}</div>`;
}

// Barre du mode vérification : bouton d'entrée, puis décompte de ce qui manque.
function checkBar(r){
  const total = r.ingredients.length;
  if(!checkMode){
    return `<div class="checkbar"><button class="check-toggle" onclick="toggleCheckMode()">Vérifier les ingrédients</button></div>`;
  }
  const missing = r.ingredients.filter((ing,i)=>!checked.has(String(i)) && !isOptionalIngredient(ing.name)).length;
  const label = missing === 0
    ? 'Tu as tout ✓'
    : `${missing} à vérifier sur ${total}`;
  return `<div class="checkbar">`
    + `<span class="check-count ${missing===0?'ok':''}">${label}</span>`
    + `<button class="check-toggle" onclick="resetChecked()">Tout décocher</button>`
    + `<button class="check-toggle" onclick="toggleCheckMode()">Quitter</button>`
    + `</div>`;
}

// Barre des étapes : n'apparaît qu'une fois la première étape cochée, pour ne
// pas encombrer une recette qu'on ne fait que lire.
function stepBar(r){
  const total = (r.steps || []).length;
  const done = (r.steps || []).filter((s, i) => doneSteps.has(String(i))).length;
  if(!done) return `<div class="stepbar"></div>`;
  const label = done === total ? 'Recette terminée ✓' : `${done} / ${total} étapes`;
  return `<div class="stepbar">`
    + `<span class="step-count ${done === total ? 'ok' : ''}">${label}</span>`
    + `<button class="check-toggle" onclick="resetSteps()">Recommencer</button>`
    + `</div>`;
}

// L'étape courante est la première qui reste à faire : quand on relève les yeux
// de la casserole, on retrouve où on en était.
function currentStep(){
  const total = (recipe.steps || []).length;
  for(let i = 0; i < total; i++){
    if(!doneSteps.has(String(i))) return i;
  }
  return -1;
}

// Repeint l'état des étapes sans re-rendre la page : un render() complet
// couperait les minuteurs en cours.
function paintSteps(){
  const current = currentStep();
  document.querySelectorAll('.steps li').forEach((li, i) => {
    const done = doneSteps.has(String(i));
    li.classList.toggle('done', done);
    li.classList.toggle('current', i === current);
    const mark = li.querySelector('.step-mark');
    if(!mark) return;
    mark.textContent = done ? '✓' : String(i + 1);
    mark.setAttribute('aria-pressed', done ? 'true' : 'false');
    mark.title = done ? 'Étape faite — cliquer pour la refaire' : 'Marquer cette étape comme faite';
  });
  const bar = document.querySelector('.stepbar');
  if(bar) bar.outerHTML = stepBar(recipe);
  paintUsedIngredients();
}

// Un ingrédient est grisé quand toutes les étapes qui le citent sont faites :
// le beurre de la pâte et celui de la garniture restent visibles jusqu'à la
// seconde. Un ingrédient qu'aucune étape ne cite n'est jamais grisé.
function isUsed(k){
  const steps = stepsOfIng[k] || [];
  return steps.length > 0 && steps.every(i => doneSteps.has(String(i)));
}

function paintUsedIngredients(){
  document.querySelectorAll('.ing-row[data-row]').forEach(row => {
    const used = isUsed(Number(row.dataset.row));
    row.classList.toggle('used', used);
    if(used) row.title = 'Déjà utilisé dans les étapes faites';
    else row.removeAttribute('title');
  });
}

function markStep(index, done){
  const key = String(index);
  if(done) doneSteps.add(key); else doneSteps.delete(key);
  saveDoneSteps();
  paintSteps();
}

function timesBar(r){
  const parts = [
    ['Préparation', r.prep_time],
    ['Cuisson', r.cook_time],
    ['Repos', r.rest_time],
  ].filter(([, v]) => v);

  const cells = parts.map(([label, v]) =>
    `<div class="time-cell"><span class="time-label">${label}</span><span class="time-value">${escapeHtml(formatDuration(v))}</span></div>`
  );
  // Un seul temps se suffit à lui-même : pas de total qui le répète.
  if(parts.length > 1){
    const total = parts.reduce((sum, [, v]) => sum + v, 0);
    cells.push(`<div class="time-cell total"><span class="time-label">Total</span><span class="time-value">${escapeHtml(formatDuration(total))}</span></div>`);
  }
  if(r.mold){
    cells.push(`<div class="time-cell"><span class="time-label">Moule</span><span class="time-value">${escapeHtml(r.mold)}</span></div>`);
  }
  if(!cells.length) return '';
  return `<div class="timesbar">${cells.join('')}</div>`;
}

// --- Minuteurs ---

function clock(seconds){
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

// Un minuteur est identifié par une clé : le numéro de l'étape, ou
// « c<section>-<tableau>-<ligne>-<colonne> » pour une case de tableau d'un mémo.
function isStepTimer(key){
  return /^\d+$/.test(String(key));
}

function timerMinutes(key){
  const cell = /^c(\d+)-(\d+)-(\d+)-(\d+)$/.exec(key);
  if(cell) return recipe.sections[cell[1]].blocks[cell[2]].rows[cell[3]][cell[4]].minutes;
  return recipe.steps[key].minutes;
}

// data-minutes n'est lu qu'à l'impression : la durée de l'étape ne vit nulle
// part ailleurs dans le DOM, splitStepDuration l'ayant retirée du texte.
function timerButton(key, minutes){
  return `<button class="timer" data-timer="${key}" data-minutes="${escapeHtml(formatDuration(minutes))}" type="button"></button>`
    + `<button class="timer-less" data-less="${key}" type="button" title="Lancé en retard : 30 secondes de moins" hidden>−30 s</button>`
    + `<button class="timer-more" data-more="${key}" type="button" title="Une minute de plus" hidden>+1 min</button>`
    + `<button class="timer-reset" data-reset="${key}" type="button" title="Réinitialiser">↺</button>`;
}

// Un minuteur retient son heure de fin, pas un décompte : un téléphone
// verrouillé ou une page en arrière-plan suspend les tics, et un décompte
// prendrait du retard. Le temps restant se recalcule sur l'horloge.
//   { endsAt }      en cours, heure de fin en ms
//   { left }        en pause, ms restantes
//   { done: true }  terminé
function timerLeft(t){
  if(t.done) return 0;
  if(t.endsAt) return Math.max(0, t.endsAt - Date.now());
  return t.left;
}

function timerText(t){
  return clock(Math.ceil(timerLeft(t) / 1000));
}

function paintTimer(key){
  const btn = document.querySelector(`.timer[data-timer="${key}"]`);
  if(!btn) return;
  const t = timers[key];
  const reset = document.querySelector(`.timer-reset[data-reset="${key}"]`);
  const more = document.querySelector(`.timer-more[data-more="${key}"]`);
  const less = document.querySelector(`.timer-less[data-less="${key}"]`);
  // −30 s disparaît sous les 30 dernières secondes, pour qu'un toucher de trop
  // n'arrête pas le minuteur, et pendant « Effacer ? », qui prend sa place.
  if(less) less.hidden = !t || !!t.done || timerLeft(t) <= 30000 || resetArmed.has(key);

  if(!t){
    btn.textContent = `▶ ${formatDuration(timerMinutes(key))}`;
    btn.className = 'timer';
    if(reset) reset.hidden = true;
    if(more) more.hidden = true;
    return;
  }
  if(reset) reset.hidden = false;
  if(more) more.hidden = !t.done;
  if(t.done){
    const ring = ringing.has(key);
    btn.textContent = ring ? '🔔 terminé' : '✓ terminé';
    btn.className = 'timer done' + (ring ? ' ringing' : '');
    return;
  }
  btn.textContent = `${t.endsAt ? '⏸' : '▶'} ${timerText(t)}`;
  btn.className = 'timer ' + (t.endsAt ? 'running' : 'paused');
}

function paintAllTimers(){
  document.querySelectorAll('.timer').forEach(btn => paintTimer(btn.dataset.timer));
  paintTimerBar();
}

// --- Bandeau des minuteurs ---
// Un minuteur lancé sort de l'écran dès qu'on fait défiler la fiche : le
// bandeau, en bas à gauche, le rappelle tant que son bouton n'est pas visible.
// Les pastilles sont mises à jour sur place, pas recréées : un toucher qui
// tomberait pendant le tic de chaque seconde serait perdu.

const timerBar = document.getElementById('timer-bar');

function timerLabel(key){
  if(isStepTimer(key)) return 'Étape ' + (Number(key) + 1);
  const cell = /^c(\d+)-(\d+)-(\d+)-(\d+)$/.exec(key);
  const label = recipe.sections[cell[1]].blocks[cell[2]].rows[cell[3]][0].text;
  return label.length > 22 ? label.slice(0, 21) + '…' : label;
}

function paintTimerBar(){
  const shown = Object.keys(timers).filter(key => {
    const btn = document.querySelector(`.timer[data-timer="${key}"]`);
    if(!btn) return false;
    const box = btn.getBoundingClientRect();
    return box.bottom < 0 || box.top > window.innerHeight;
  });
  timerBar.querySelectorAll('.timer-chip').forEach(chip => {
    if(!shown.includes(chip.dataset.chip)) chip.remove();
  });
  shown.forEach(key => {
    let chip = timerBar.querySelector(`.timer-chip[data-chip="${key}"]`);
    if(!chip){
      chip = document.createElement('button');
      chip.type = 'button';
      chip.dataset.chip = key;
      timerBar.append(chip);
    }
    const t = timers[key];
    const state = t.done ? 'done' + (ringing.has(key) ? ' ringing' : '') : t.endsAt ? 'running' : 'paused';
    chip.className = 'timer-chip ' + state;
    chip.textContent = `${timerLabel(key)} · ${t.done ? 'terminé' : timerText(t)}`;
  });
  timerBar.hidden = !shown.length;
}
window.addEventListener('scroll', paintTimerBar, { passive: true });
window.addEventListener('resize', paintTimerBar);

timerBar.addEventListener('click', event => {
  const chip = event.target.closest('.timer-chip');
  if(!chip) return;
  const key = chip.dataset.chip;
  unlockAudio();
  stopRinging(key);
  const btn = document.querySelector(`.timer[data-timer="${key}"]`);
  if(btn) btn.scrollIntoView({ block: 'center', behavior: 'smooth' });
});

// --- Mémoire des minuteurs ---
// Un rechargement (le téléphone en fait de lui-même après un passage dans une
// autre appli) ne doit pas les perdre. Même délai que les étapes cochées.

function timersKey(){
  return 'mes-recettes:timers:' + (recipe ? recipe.id : '');
}

function saveTimers(){
  try{
    if(!Object.keys(timers).length) localStorage.removeItem(timersKey());
    else localStorage.setItem(timersKey(), JSON.stringify({at: Date.now(), timers}));
  }catch(e){ /* navigation privée, quota : les minuteurs tournent sans mémoire */ }
}

function loadTimers(){
  try{
    const raw = localStorage.getItem(timersKey());
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(Date.now() - (saved.at || 0) > STEPS_TTL){ localStorage.removeItem(timersKey()); return; }
    Object.assign(timers, saved.timers || {});
  }catch(e){ /* mémoire illisible : on repart sans minuteur */ }
}

// --- Sonnerie ---
// Safari ne laisse jouer un son qu'à la suite d'un geste : le contexte audio se
// prépare quand on touche un minuteur, pas au moment de sonner, où il n'y a
// plus de geste et où il resterait muet.
let audio = null;
function unlockAudio(){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state !== 'running') audio.resume();
  }catch(e){ /* pas de son disponible : l'affichage suffit */ }
}
// Un minuteur restauré après un rechargement n'a pas eu de geste : le premier
// toucher sur la page, quel qu'il soit, prépare le son.
document.addEventListener('pointerdown', () => {
  if(Object.keys(timers).length) unlockAudio();
}, { passive: true });

function beep(){
  try{
    unlockAudio();
    const now = audio.currentTime;
    [0, 0.45].forEach(offset => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.2, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.35);
      osc.connect(gain).connect(audio.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.4);
    });
  }catch(e){ /* pas de son disponible : l'affichage suffit */ }
  // Android seulement : l'iPhone ne laisse pas vibrer un site.
  try{ if(navigator.vibrate) navigator.vibrate([200, 100, 200]); }catch(e){ /* sans vibration */ }
}

// Deux bips se ratent avec la hotte allumée : la sonnerie reprend toutes les
// 3 s jusqu'à ce qu'on touche le minuteur, sa pastille ou l'étape, et se tait
// d'elle-même au bout de 30 s.
const RING_EVERY = 3000;
const RING_FOR = 30000;
const ringing = new Map();

function startRinging(key){
  ringing.set(key, { until: Date.now() + RING_FOR, last: 0 });
}

function stopRinging(key){
  if(ringing.delete(String(key))) paintAllTimers();
}

function ring(){
  const now = Date.now();
  ringing.forEach((r, key) => {
    if(now > r.until){ ringing.delete(key); return; }
    // Le tic d'une seconde arrive un peu avant ou après : la demi-seconde de
    // marge évite qu'un bip sur deux glisse au tic suivant.
    if(now - r.last >= RING_EVERY - 500){ beep(); r.last = now; }
  });
}

// --- Écran allumé ---
// Verrouillé, le téléphone suspend la page : la sonnerie ne partirait pas. On
// garde donc l'écran allumé tant qu'un minuteur tourne ou sonne. Le verrou
// tombe de lui-même quand la page passe en arrière-plan, et se reprend au retour.
let wakeLock = null;
let wakePending = false;
async function updateWakeLock(){
  if(!navigator.wakeLock) return;
  const need = ringing.size > 0 || Object.values(timers).some(t => t.endsAt);
  if(need && !wakeLock && !wakePending && document.visibilityState === 'visible'){
    wakePending = true;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }catch(e){ /* refusé (batterie faible…) : l'écran se mettra en veille */ }
    wakePending = false;
  } else if(!need && wakeLock){
    const lock = wakeLock;
    wakeLock = null;
    lock.release().catch(() => {});
  }
}

// --- Tic ---
// Termine les minuteurs échus. ringIt est faux au chargement : un minuteur
// fini pendant que la page était fermée s'affiche terminé, sans sonner.
function tick(ringIt = true){
  let changed = false;
  Object.keys(timers).forEach(key => {
    const t = timers[key];
    if(!t.endsAt || t.endsAt > Date.now()) return;
    timers[key] = { done: true };
    changed = true;
    if(ringIt) startRinging(key);
    if(isStepTimer(key)) markStep(key, true);
  });
  if(changed) saveTimers();
  ring();
  paintAllTimers();
  updateWakeLock();
}
setInterval(tick, 1000);
// Au retour sur la page, sans attendre le prochain tic : l'affichage est juste
// tout de suite, et ce qui a fini entre-temps sonne.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') tick();
});

const resetArmed = new Map();
function disarmReset(key){
  clearTimeout(resetArmed.get(key));
  resetArmed.delete(key);
  const reset = document.querySelector(`.timer-reset[data-reset="${key}"]`);
  if(!reset) return;
  reset.textContent = '↺';
  reset.classList.remove('confirm');
  paintTimer(key);
}

function timerChanged(){
  saveTimers();
  paintAllTimers();
  updateWakeLock();
}

document.getElementById('content').addEventListener('change', event => {
  const box = event.target.closest('input[data-ing]');
  if(!box) return;
  const key = box.dataset.ing;
  if(box.checked) checked.add(key); else checked.delete(key);
  saveChecked();
  box.closest('.ing-row').classList.toggle('has', box.checked);
  // Seul le décompte bouge : un re-rendu complet couperait les minuteurs en cours.
  const bar = document.querySelector('.checkbar');
  if(bar) bar.outerHTML = checkBar(recipe);
});

document.getElementById('content').addEventListener('click', event => {
  const mark = event.target.closest('.step-mark');
  if(mark){
    const index = mark.dataset.step;
    stopRinging(index);
    markStep(index, !doneSteps.has(String(index)));
    return;
  }
  const start = event.target.closest('.timer');
  if(start){
    const key = start.dataset.timer;
    const t = timers[key];
    unlockAudio();
    // Qui sonne se tait d'un toucher, sans repartir pour un tour.
    if(ringing.has(key)){ stopRinging(key); updateWakeLock(); return; }
    if(!t || t.done){
      timers[key] = { endsAt: Date.now() + timerMinutes(key) * 60000 };
      if(isStepTimer(key)) markStep(key, false);
    } else if(t.endsAt){
      timers[key] = { left: Math.max(0, t.endsAt - Date.now()) };
    } else {
      timers[key] = { endsAt: Date.now() + t.left };
    }
    timerChanged();
    return;
  }
  // Minuteur lancé en retard : on retire le temps oublié, 30 s par toucher. Au
  // moins une seconde reste, pour que le minuteur finisse par sonner.
  const less = event.target.closest('.timer-less');
  if(less){
    const key = less.dataset.less;
    const t = timers[key];
    if(!t || t.done) return;
    unlockAudio();
    if(t.endsAt) t.endsAt = Math.max(t.endsAt - 30000, Date.now() + 1000);
    else t.left = Math.max(t.left - 30000, 1000);
    timerChanged();
    return;
  }
  // Le centre des cookies n'est pas pris : une minute de plus, sans relancer
  // toute la durée.
  const more = event.target.closest('.timer-more');
  if(more){
    const key = more.dataset.more;
    unlockAudio();
    stopRinging(key);
    timers[key] = { endsAt: Date.now() + 60000 };
    if(isStepTimer(key)) markStep(key, false);
    timerChanged();
    return;
  }
  const reset = event.target.closest('.timer-reset');
  if(reset){
    const key = reset.dataset.reset;
    // Un minuteur qui a encore du temps ne s'efface pas d'un toucher maladroit :
    // le premier arme le bouton (« Effacer ? »), le second, dans les 3 s, confirme.
    const t = timers[key];
    if(t && !t.done && !resetArmed.has(key)){
      reset.textContent = 'Effacer ?';
      reset.classList.add('confirm');
      resetArmed.set(key, setTimeout(() => disarmReset(key), 3000));
      paintTimer(key);
      return;
    }
    disarmReset(key);
    stopRinging(key);
    delete timers[key];
    if(isStepTimer(key)) markStep(key, false);
    timerChanged();
  }
});

// Sections libres : paragraphes et tableaux, dans l'ordre du fichier. Un tableau
// large défile dans son cadre plutôt que d'élargir la page sur téléphone.
function sectionsHtml(r){
  return (r.sections || []).map((section, s) => `
    <div class="section-label">${escapeHtml(section.title)}</div>
    ${section.blocks.map((block, b) => block.kind === 'text'
      ? `<p class="memo-text">${escapeHtml(block.text)}</p>`
      : `<div class="table-wrap"><table class="memo-table">
          <thead><tr>${block.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
          <tbody>${block.rows.map((row, i)=>`<tr>${row.map((cell, c)=>
            `<td>${escapeHtml(cell.text)}${cell.minutes?`<span class="step-timer">${timerButton(`c${s}-${b}-${i}-${c}`, cell.minutes)}</span>`:''}</td>`
          ).join('')}</tr>`).join('')}</tbody>
        </table></div>`
    ).join('')}
  `).join('');
}

// Un mémo n'a ni portions ni ingrédients : ni barre de portions, ni
// vérification du placard, ni étapes à cocher.
// Quantité ajustée aux portions choisies, déjà échappée.
function qtyHtml(ing){
  const factor = servings / (parseFloat(recipe.servings) || 4);
  const amt = ing.amount ? (Math.round(ing.amount*factor*100)/100) : '';
  return `${amt}${ing.unit?(' '+escapeHtml(ing.unit)):''}`;
}

function plainIngRow(ing, i){
  return `<div class="ing-row" data-row="${i}"><span>${escapeHtml(ing.name)}</span><span>${qtyHtml(ing)}</span></div>`;
}

// Les quantités des ingrédients que l'étape cite, sous son texte. Un ingrédient
// sans quantité (sel, poivre) n'apprendrait rien de plus que le texte : omis.
function stepIngsHtml(i){
  const items = (stepIngs[i] || [])
    .map(k => recipe.ingredients[k])
    .filter(ing => ing.amount || ing.unit)
    .map(ing => `<span class="step-ing"><b>${qtyHtml(ing)}</b> ${escapeHtml(ingredientLabel(ing.name))}</span>`);
  return items.length ? `<div class="step-ings">${items.join('')}</div>` : '';
}

// Portions et ingrédients : rangés avec les temps dans .head-col, à la largeur
// des étapes.
function recipeHead(r){
  return `
    <div class="section-label ing-head"><span>Ingrédients</span>
      <div class="servingsbar">
        <button onclick="changeServings(-1)" aria-label="Une portion de moins">−</button>
        <span>${escapeHtml(formatYield(Math.round(servings), r.yield_label))}</span>
        <button onclick="changeServings(1)" aria-label="Une portion de plus">+</button>
      </div>
    </div>
    ${checkBar(r)}
    <div class="ing-list">${r.ingredients.map((ing,i)=>{
      if(!checkMode) return plainIngRow(ing, i);
      const optional = isOptionalIngredient(ing.name);
      const has = checked.has(String(i));
      return `<label class="ing-row check ${has?'has':''}" data-row="${i}">`
        + `<input type="checkbox" data-ing="${i}" ${has?'checked':''}>`
        + `<span class="ing-name">${escapeHtml(ingredientLabel(ing.name))}`
        + `${optional?'<span class="opt">optionnel</span>':''}</span>`
        + `<span>${qtyHtml(ing)}</span></label>`;
    }).join('')}</div>
  `;
}

function recipeSteps(r){
  return `
    <div class="section-label steps-head"><span>Étapes</span>${stepBar(r)}</div>
    <ol class="steps">${r.steps.map((s,i)=>
      `<li><button class="step-mark" type="button" data-step="${i}" aria-pressed="false"></button>`
      + `${escapeHtml(s.text)}${s.minutes?`<span class="step-timer">${timerButton(i, s.minutes)}</span>`:''}`
      + `${stepIngsHtml(i)}</li>`
    ).join('')}</ol>
  `;
}

// --- Panneau des ingrédients ---
// En pleine préparation, la liste est loin au-dessus : un bouton flottant
// l'ouvre par-dessus la page, sans perdre sa place dans les étapes. Il
// apparaît dès que plus de la moitié de la liste est sortie par le haut : deux
// lignes qui dépassent encore en haut de l'écran ne disent pas les quantités.

const fab = document.getElementById('ing-fab');
const sheet = document.getElementById('ing-sheet');

function updateFab(){
  const list = recipe && recipe.ingredients.length && document.querySelector('#content .ing-list');
  if(!list){ fab.hidden = true; return; }
  const box = list.getBoundingClientRect();
  fab.hidden = box.bottom > Math.min(box.height, window.innerHeight) / 2;
}
window.addEventListener('scroll', updateFab, { passive: true });
window.addEventListener('resize', updateFab);

fab.addEventListener('click', () => {
  document.getElementById('ing-sheet-title').textContent =
    'Ingrédients · ' + formatYield(Math.round(servings), recipe.yield_label);
  document.getElementById('ing-sheet-body').innerHTML =
    recipe.ingredients.map(plainIngRow).join('');
  paintUsedIngredients();
  sheet.showModal();
});

sheet.querySelector('.sheet-close').addEventListener('click', () => sheet.close());
// Un clic sur le fond assombri tombe sur le <dialog> lui-même, pas sur son contenu.
sheet.addEventListener('click', event => { if(event.target === sheet) sheet.close(); });

// --- QR code et partage ---
// L'adresse partagée est réduite à ?id=, sans ce que la barre d'adresse
// pourrait porter d'autre.
function recipeUrl(){
  return location.origin + location.pathname + '?id=' + encodeURIComponent(recipe.id);
}

// Le QR code, pour quelqu'un à côté de soi : il photographie l'écran. Calculé à
// l'ouverture, jamais stocké. Fond blanc imposé même en mode sombre : un code
// clair sur fond sombre échappe à certains lecteurs.

const qrToggle = document.getElementById('qr-toggle');
const qrSheet = document.getElementById('qr-sheet');

qrToggle.addEventListener('click', () => {
  const qr = qrcode(0, 'M');
  qr.addData(recipeUrl());
  qr.make();
  document.getElementById('qr-sheet-body').innerHTML =
    qr.createSvgTag({ cellSize: 4, margin: 16, scalable: true, title: recipe.title })
    + `<div class="qr-title">${escapeHtml(recipe.title)}</div>`;
  qrSheet.showModal();
});

qrSheet.querySelector('.sheet-close').addEventListener('click', () => qrSheet.close());
qrSheet.addEventListener('click', event => { if(event.target === qrSheet) qrSheet.close(); });

// Le partage, pour quelqu'un d'absent : le menu de partage du téléphone (SMS,
// messageries…). Firefox sur ordinateur ne l'a pas : le lien part alors dans
// le presse-papiers, et en dernier recours s'affiche, sélectionné, à copier.

const shareToggle = document.getElementById('share-toggle');
let shareDoneTimer = null;

shareToggle.addEventListener('click', async () => {
  const url = recipeUrl();
  if(navigator.share){
    try{
      // title seul ne suffit pas : messageries et SMS l'ignorent et n'envoient
      // que text et url. Le titre passe donc aussi dans le message.
      await navigator.share({ title: recipe.title, text: recipe.title, url });
      return;
    }catch(e){
      // Menu refermé sans rien choisir : rien d'autre à faire.
      if(e.name === 'AbortError') return;
    }
  }
  try{
    await navigator.clipboard.writeText(url);
    shareToggle.classList.add('copied');
    clearTimeout(shareDoneTimer);
    shareDoneTimer = setTimeout(() => shareToggle.classList.remove('copied'), 2000);
  }catch(e){
    window.prompt('Lien de la recette :', url);
  }
});

function render(){
  const r = recipe;
  const st = STATUS_META[r.status] || STATUS_META.none;
  document.getElementById('content').innerHTML = `
    <h2>${escapeHtml(r.title)} <span class="mark ${escapeHtml(r.status)}">${st.icon}</span></h2>
    ${r.description?`<div class="desc">${escapeHtml(r.description)}</div>`:''}
    <div class="tags">
      ${r.type==='memo'?'<span class="tag memo">mémo</span>':''}
      ${r.categories.map(c=>`<span class="tag">${escapeHtml(c)}</span>`).join('')}
      ${st.label?`<span class="tag tag-${escapeHtml(r.status)}">${st.label}</span>`:''}
    </div>
    <div class="head-col">${timesBar(r)}${r.type==='memo'?'':recipeHead(r)}</div>
    ${r.type==='memo'?'':recipeSteps(r)}
    ${sectionsHtml(r)}
    ${r.notes?`<div class="section-label">Notes</div><div class="notes${r.type==='memo'?' wide':''}">${escapeHtml(r.notes)}</div>`:''}
    ${seeAlsoHtml()}
    ${r.source_url?`<a class="sourcelink" href="${escapeHtml(r.source_url)}" target="_blank" rel="noopener">Source originale ↗</a>`:''}
    ${dateLine(r)}
  `;
  paintSteps();
  paintAllTimers();
  updateFab();
}

load();
</script>
</body>
</html>
